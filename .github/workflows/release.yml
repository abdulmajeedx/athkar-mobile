name: Release APK

# Tagging is the release trigger: `git tag v1.0.1 && git push origin v1.0.1` publishes a signed
# build. workflow_dispatch is here for re-running a release without moving the tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 1.0.1)"
        required: true

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK, so this only makes sure the exact
      # build-tools and platform this project pins are present. The setup-android action is not
      # used: it insists on installing the retired "Android SDK Tools" package, whose archive no
      # longer unpacks, and fails the job before anything is built.
      - name: Ensure the pinned SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;35.0.0" "platforms;android-35"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # versionCode must never go backwards or Android refuses the update, so it is derived from the
      # version itself rather than from a run number that resets when the workflow is recreated.
      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NAME="${{ inputs.version }}"
          else
            NAME="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$NAME' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          MAJOR="${NAME%%.*}"
          REST="${NAME#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $NAME (versionCode $CODE)"

      - name: Run tests
        working-directory: android
        run: ./gradlew test --console=plain

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ATHKAR_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret ATHKAR_KEYSTORE_BASE64 is not set — refusing to publish an unsigned release"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/athkar-release.jks"

      - name: Build the signed release APK
        working-directory: android
        env:
          ATHKAR_KEYSTORE_FILE: ${{ runner.temp }}/athkar-release.jks
          ATHKAR_KEYSTORE_PASSWORD: ${{ secrets.ATHKAR_KEYSTORE_PASSWORD }}
          ATHKAR_KEY_ALIAS: ${{ secrets.ATHKAR_KEY_ALIAS }}
          ATHKAR_KEY_PASSWORD: ${{ secrets.ATHKAR_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --console=plain \
            -Pathkar.versionCode=${{ steps.version.outputs.code }} \
            -Pathkar.versionName=${{ steps.version.outputs.name }}

      # Publishing a build nobody has launched is how v1.0.1 shipped a crash-on-open. The signed
      # artifact itself is started on an emulator here, so a release that cannot open cannot ship.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the emulator's shared libraries
        run: |
          # ubuntu-24.04 runners ship without libpulse, which the emulator's qemu binary links at
          # load time. Without it the process dies before executing a line and adb only ever reports
          # a device that is not there.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 libnss3

      - name: Boot an emulator and launch the signed APK
        env:
          ANDROID_AVD_HOME: ${ github.workspace }/.avd
        run: |
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$ANDROID_HOME/platform-tools:$PATH"
          scripts/ci/boot-emulator.sh 34 google_apis
          scripts/ci/smoke-test.sh \
            android/app/build/outputs/apk/release/app-release.apk \
            com.athkar.app

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: |
            logcat.txt
            emulator.log
          if-no-files-found: ignore

      # The build falls back to the debug key when signing material is missing. That fallback is
      # useful locally and catastrophic in a release: a debug-signed APK can never update an
      # installed one. Fail here rather than let users discover it.
      - name: Verify the signature
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/35.0.0/apksigner)
          APK=android/app/build/outputs/apk/release/app-release.apk
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          if grep -q "CN=Android Debug" <<< "$CERTS"; then
            echo "::error::APK is signed with the debug key — the release signing secrets did not reach the build"
            exit 1
          fi

      - name: Name the artifact
        id: artifact
        run: |
          set -euo pipefail
          DEST="athkar-${{ steps.version.outputs.name }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          sha256sum "$DEST" | tee "$DEST.sha256"

          # R8 renames everything, so a crash report from this build is unreadable without the
          # mapping that produced it. Publishing it alongside the APK is what makes `retrace`
          # possible months later, when the build tree is long gone.
          MAPPING=android/app/build/outputs/mapping/release/mapping.txt
          if [ -f "$MAPPING" ]; then
            cp "$MAPPING" "mapping-${{ steps.version.outputs.name }}.txt"
            echo "mapping=mapping-${{ steps.version.outputs.name }}.txt" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.name }}"
          NOTES=$(cat <<'EOF'
          ### التثبيت

          نزّل ملف `.apk` أدناه وثبّته، أو أضف هذا المستودع في تطبيق
          [Obtainium](https://github.com/ImranR98/Obtainium) ليصلك إشعار بكل إصدار جديد ويحدّثه بضغطة.

          `sha256` مرفق للتحقق من سلامة الملف.
          EOF
          )
          # --clobber so re-running the workflow for the same tag replaces the asset instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.artifact.outputs.path }}" \
              "${{ steps.artifact.outputs.path }}.sha256" \
              ${{ steps.artifact.outputs.mapping && format('"{0}"', steps.artifact.outputs.mapping) || '' }} --clobber
          else
            gh release create "$TAG" \
              --title "أذكاري ${{ steps.version.outputs.name }}" \
              --notes "$NOTES" \
              "${{ steps.artifact.outputs.path }}" \
              "${{ steps.artifact.outputs.path }}.sha256" \
              ${{ steps.artifact.outputs.mapping && format('"{0}"', steps.artifact.outputs.mapping) || '' }}
          fi
