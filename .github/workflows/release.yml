name: Release

# Tagging is the release trigger: `git tag v1.0.1 && git push origin v1.0.1` publishes a signed
# build. workflow_dispatch is here for re-running a release without moving the tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 1.0.1)"
        required: true
      publish:
        description: "Upload to Google Play. Leave off to only send the APK for testing."
        type: boolean
        default: false

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK, so this only makes sure the exact
      # build-tools and platform this project pins are present. The setup-android action is not
      # used: it insists on installing the retired "Android SDK Tools" package, whose archive no
      # longer unpacks, and fails the job before anything is built.
      - name: Ensure the pinned SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;35.0.0" "platforms;android-35"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # versionCode must never go backwards or Android refuses the update, so it is derived from the
      # version itself rather than from a run number that resets when the workflow is recreated.
      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NAME="${{ inputs.version }}"
          else
            NAME="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$NAME' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          MAJOR="${NAME%%.*}"
          REST="${NAME#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $NAME (versionCode $CODE)"

      - name: Run tests
        working-directory: android
        run: ./gradlew test --console=plain

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ATHKAR_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret ATHKAR_KEYSTORE_BASE64 is not set — refusing to publish an unsigned release"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/athkar-release.jks"

      # Two artifacts from one build: the .aab is what Google Play accepts for upload, the .apk
      # is what a person installs directly from a run's artifacts. Play will not take an
      # APK for a new app, and an AAB cannot be sideloaded, so neither one replaces the other.
      - name: Build the signed release APK and AAB
        working-directory: android
        env:
          ATHKAR_KEYSTORE_FILE: ${{ runner.temp }}/athkar-release.jks
          ATHKAR_KEYSTORE_PASSWORD: ${{ secrets.ATHKAR_KEYSTORE_PASSWORD }}
          ATHKAR_KEY_ALIAS: ${{ secrets.ATHKAR_KEY_ALIAS }}
          ATHKAR_KEY_PASSWORD: ${{ secrets.ATHKAR_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease --console=plain \
            -Pathkar.versionCode=${{ steps.version.outputs.code }} \
            -Pathkar.versionName=${{ steps.version.outputs.name }}

      # Publishing a build nobody has launched is how v1.0.1 shipped a crash-on-open. The signed
      # artifact itself is started on an emulator here, so a release that cannot open cannot ship.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the emulator's shared libraries
        run: |
          # ubuntu-24.04 runners ship without libpulse, which the emulator's qemu binary links at
          # load time. Without it the process dies before executing a line and adb only ever reports
          # a device that is not there.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 libnss3
          # The emulator wants ~7 GB for userdata and the Gradle build has already taken its share.
          # The bundled NDK is gigabytes of toolchain nothing here compiles against.
          sudo rm -rf "$ANDROID_HOME/ndk" /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Boot an emulator and launch the signed APK
        env:
          ANDROID_AVD_HOME: ${{ github.workspace }}/.avd
        run: |
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$ANDROID_HOME/platform-tools:$PATH"
          scripts/ci/boot-emulator.sh 34 google_apis
          scripts/ci/smoke-test.sh \
            android/app/build/outputs/apk/release/app-release.apk \
            com.athkar.mobile

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: |
            logcat.txt
            emulator.log
            screenshots/
          if-no-files-found: ignore

      # The build falls back to the debug key when signing material is missing. That fallback is
      # useful locally and catastrophic in a release: a debug-signed APK can never update an
      # installed one. Fail here rather than let users discover it.
      - name: Verify the signatures
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/35.0.0/apksigner)
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab

          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          if grep -q "CN=Android Debug" <<< "$CERTS"; then
            echo "::error::APK is signed with the debug key — the release signing secrets did not reach the build"
            exit 1
          fi

          # apksigner only understands APKs; a bundle carries an ordinary JAR signature, so the
          # same debug-key check has to be made with jarsigner or it would not be made at all.
          BUNDLE_CERTS=$(jarsigner -verify -verbose:summary -certs "$AAB")
          if grep -q "CN=Android Debug" <<< "$BUNDLE_CERTS"; then
            echo "::error::AAB is signed with the debug key — Play would reject it and it could never be updated"
            exit 1
          fi
          if ! grep -q "jar verified" <<< "$BUNDLE_CERTS"; then
            echo "::error::AAB signature did not verify"
            exit 1
          fi
          echo "AAB signature verified"

      - name: Name the artifact
        id: artifact
        run: |
          set -euo pipefail
          DEST="athkar-${{ steps.version.outputs.name }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          sha256sum "$DEST" | tee "$DEST.sha256"

          BUNDLE="athkar-${{ steps.version.outputs.name }}.aab"
          cp android/app/build/outputs/bundle/release/app-release.aab "$BUNDLE"
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
          sha256sum "$BUNDLE" | tee "$BUNDLE.sha256"

          # R8 renames everything, so a crash report from this build is unreadable without the
          # mapping that produced it. Publishing it alongside the APK is what makes `retrace`
          # possible months later, when the build tree is long gone.
          MAPPING=android/app/build/outputs/mapping/release/mapping.txt
          if [ -f "$MAPPING" ]; then
            cp "$MAPPING" "mapping-${{ steps.version.outputs.name }}.txt"
            echo "mapping=mapping-${{ steps.version.outputs.name }}.txt" >> "$GITHUB_OUTPUT"
          fi

      # Keep the signed build reachable from the run itself, so an expired distribution token
      # never leaves a green build with nothing to download.
      - name: Upload the signed build
        uses: actions/upload-artifact@v4
        with:
          name: athkar-${{ steps.version.outputs.name }}
          path: |
            athkar-${{ steps.version.outputs.name }}.*
            mapping-${{ steps.version.outputs.name }}.txt
          if-no-files-found: error

      # The build goes to a phone before it goes to anyone else.
      #
      # Every gate above this line proves the app compiles, passes its tests, is signed by the right
      # key and opens on an emulator. None of them proves the adhan sounds at the right minute or
      # that the compass points anywhere true — and a crash two taps past the first screen shipped
      # to testers because CI was never looking there. This step puts the APK in a human's hands
      # first; Play waits for them to say so.
      - name: Look for a Telegram bot
        id: telegram
        env:
          HAS_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        run: echo "configured=$HAS_BOT" >> "$GITHUB_OUTPUT"

      - name: Send the build for testing
        if: steps.telegram.outputs.configured == 'true'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK: ${{ steps.artifact.outputs.path }}
          VERSION: ${{ steps.version.outputs.name }}
          PUBLISHING: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          NOTES_FILE="docs/release-notes/$VERSION.ar.txt"
          if [ "${PUBLISHING:-false}" = "true" ]; then
            HEADER="نسخة $VERSION — ذاهبة إلى بلاي بعد هذا"
          else
            HEADER="نسخة $VERSION — للتجربة، لم تُرفع إلى بلاي"
          fi
          # Built in a file rather than inline: the caption is multi-line, and a literal newline
          # inside this block would end it as far as the YAML parser is concerned.
          { printf '%s\n\n' "$HEADER"; [ -f "$NOTES_FILE" ] && cat "$NOTES_FILE"; } > caption.txt
          # --form-string, so a caption that happened to start with @ is text and not a filename.
          curl -sS --fail-with-body \
            -X POST "https://api.telegram.org/bot$TOKEN/sendDocument" \
            -F "chat_id=$CHAT" \
            -F "document=@$APK" \
            --form-string "caption=$(cat caption.txt)" \
            -o /dev/null
          rm -f caption.txt
          echo "sent $APK to Telegram"

      # Delivery to Google Play, when — and only when — a service account is configured. Without
      # the secret this is skipped and the tag still produces a validated, published GitHub release,
      # so a clone of this repository keeps working exactly as before.
      #
      # Ahead of the GitHub release on purpose: the two are independent deliveries, and this one
      # reaches users, and for a while it was ordered behind a GitHub release step whose token had
      # expired — so a broken mirror took the store upload down with it.
      #
      # It uploads as a DRAFT on purpose. Everything above this line is reproducible and reversible;
      # a Play release is neither. A tag should not be able to put a build in front of users while
      # nobody is looking — the last step stays a human pressing a button in the console, with the
      # rollout percentage they choose.
      # A step's own `env` is not readable from its `if`, and the `secrets` context is not
      # available there at all, so the presence of the key becomes a step output first.
      - name: Look for a Play service account
        id: play
        env:
          HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: echo "configured=$HAS_PLAY_KEY" >> "$GITHUB_OUTPUT"

      - name: Stage the release notes for Play
        if: steps.play.outputs.configured == 'true' && inputs.publish
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          # The action reads one file per locale from this directory, named for the locale.
          mkdir -p play-whatsnew
          if [ -f "docs/release-notes/$VERSION.ar.txt" ]; then
            cp "docs/release-notes/$VERSION.ar.txt" play-whatsnew/ar
          else
            printf 'إصلاحات وتحسينات داخلية.\n' > play-whatsnew/ar
          fi
          # Play truncates at 500 characters per locale rather than rejecting the upload, which
          # silently loses the tail. Fail here instead, where it can be fixed.
          LEN=$(wc -m < play-whatsnew/ar)
          if [ "$LEN" -gt 500 ]; then
            echo "::error::Play release notes are $LEN characters; the limit is 500"
            exit 1
          fi

      - name: Upload to Google Play
        if: steps.play.outputs.configured == 'true' && inputs.publish
        # Pinned to the commit, not the tag: `v1` is a moving pointer its owner can retag at any
        # time, which would silently swap the code that handles the signing key and the bundle.
        # Verified against the GitHub API — `v1` is an annotated tag resolving to this commit.
        # Re-verify before bumping.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.athkar.mobile
          releaseFiles: ${{ steps.artifact.outputs.bundle }}
          # Without this the stack traces in Play's crash reports stay obfuscated by R8, and a
          # crash report nobody can read is a crash report nobody fixes.
          mappingFile: ${{ steps.artifact.outputs.mapping }}
          # The numeric id of the closed-testing track, not a standard name: this app's track is a
          # custom one ("مختبرو أذكاري"), and uploading to the built-in `alpha` put two bundles on a
          # track nobody tests from while the real one stayed on 1.2.4.
          track: ${{ vars.PLAY_TRACK || 'alpha' }}
          # Named, or Play labels the upload after whatever draft is already open on the track and
          # a 1.2.8 bundle sits inside a release still calling itself 1.2.7.
          releaseName: ${{ steps.version.outputs.name }}
          # `draft` was the careful-looking choice and did nothing useful: it left the bundle in the
          # library, assigned to no track, with no draft release to publish — the console reported
          # no pending changes at all. On a closed track `completed` is right, because its audience
          # is a fixed list of people who opted in, and a partial rollout across a fixed list means
          # nothing.
          #
          # PLAY_STATUS exists so that pointing PLAY_TRACK at `production` cannot quietly turn a tag
          # push into a public release. Set it to `draft` before that day.
          status: ${{ vars.PLAY_STATUS || 'completed' }}
