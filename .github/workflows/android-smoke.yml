name: Android launch smoke test

# Unit tests never call Application.onCreate, so they can be entirely green while the app dies
# before drawing a frame — which is exactly what shipped in v1.0.1. This workflow builds the
# minified release APK and actually launches it on an emulator.
#
# No secrets are needed: the build falls back to the debug signing key, which changes nothing about
# R8, and R8 is what this is here to catch.
on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "scripts/ci/smoke-test.sh"
      - ".github/workflows/android-smoke.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # The lowest version the app claims to support, and a current one. The minSdk end is not
          # ceremonial: several code paths branch on API level and only run down there. It is added
          # back now that one configuration is proven green.
          - api-level: 26
            target: default
          - api-level: 34
            target: google_apis

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The emulator needs hardware acceleration, and the runner's KVM device is not world-writable
      # by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the emulator's shared libraries
        run: |
          # ubuntu-24.04 runners ship without libpulse, which the emulator's qemu binary links at
          # load time. Without it the process dies before executing a line and adb only ever reports
          # a device that is not there.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 libnss3
          # The emulator wants ~7 GB for userdata and the Gradle build has already taken its share.
          # The bundled NDK is gigabytes of toolchain nothing here compiles against.
          sudo rm -rf "$ANDROID_HOME/ndk" /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Build the minified release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Boot an emulator and launch the app
        env:
          ANDROID_AVD_HOME: ${{ github.workspace }}/.avd
        run: |
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$ANDROID_HOME/platform-tools:$PATH"
          scripts/ci/boot-emulator.sh ${{ matrix.api-level }} ${{ matrix.target }}
          scripts/ci/smoke-test.sh \
            android/app/build/outputs/apk/release/app-release.apk \
            com.athkar.app

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-api${{ matrix.api-level }}
          path: |
            logcat.txt
            emulator.log
            screenshots/
          if-no-files-found: ignore
