name: Store screenshots

# Photographs the app on a phone-sized emulator for the Play listing: the home screen, then every
# screen one tap away from a labelled element. Run it by hand and pick from the artifact.
on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the emulator shared libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 libnss3
          sudo rm -rf "$ANDROID_HOME/ndk" /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - name: Build the minified release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Boot a phone-sized emulator and photograph the app
        env:
          ANDROID_AVD_HOME: ${{ github.workspace }}/.avd
          EMULATOR_DEVICE: pixel_6
        run: |
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$ANDROID_HOME/platform-tools:$PATH"
          scripts/ci/boot-emulator.sh 34 google_apis
          bash scripts/ci/store-screenshots.sh \
            android/app/build/outputs/apk/release/app-release.apk \
            com.athkar.mobile \
            store-screenshots

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: |
            store-screenshots/
            emulator.log
          if-no-files-found: error
