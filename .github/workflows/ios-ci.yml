name: iOS build & test

# The macOS runner is the only Swift compiler this project has access to, so every push that touches
# ios/ is compiled and tested here. Nothing below needs an Apple Developer account: simulator builds
# are unsigned.
on:
  push:
    # Branches only: a tag push matches every path filter, so publishing a release used to fire a
    # full iOS build for a commit already tested on the branch it came from.
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      # Simulator names drift between runner images, so the destination is discovered rather than
      # hardcoded — a missing "iPhone 16" should not read as a broken build.
      - name: Pick a simulator
        id: simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          best = None
          for runtime, devices in runtimes.items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable') and 'iPhone' in device['name']:
                      best = device['udid']
          print(best or '')
          ")
          if [ -z "$UDID" ]; then
            echo '::error::No available iPhone simulator on this runner'
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Two assets the compiler cannot check and a device fails silently on: iOS substitutes its
      # own tone for a notification sound longer than thirty seconds or in a format it does not
      # decode, and App Store Connect rejects an upload with no 1024px icon. Both are the kind of
      # fault that only shows up at the adhan, or at the upload.
      - name: Check the bundled assets
        working-directory: ios
        run: |
          set -euo pipefail
          SOUND=Athkar/Resources/adhan.caf
          [ -f "$SOUND" ] || { echo "::error::$SOUND is missing"; exit 1; }
          afinfo "$SOUND"
          DURATION=$(afinfo "$SOUND" | awk -F': ' '/estimated duration/ {print $2 + 0}')
          awk -v d="$DURATION" 'BEGIN {
            if (d <= 0) { print "::error::Could not read the adhan\047s duration"; exit 1 }
            if (d > 30) {
              printf("::error::The adhan is %.1fs; iOS silently replaces any notification sound over 30s with its own tone\n", d)
              exit 1
            }
            printf("adhan: %.1fs, within the 30s limit\n", d)
          }'

          ICON=Athkar/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          [ -f "$ICON" ] || { echo "::error::$ICON is missing — App Store Connect rejects the upload"; exit 1; }
          sips -g pixelWidth -g pixelHeight "$ICON"

      - name: Build and test
        working-directory: ios
        run: |
          set -o pipefail
          # The full transcript goes to the log and the interesting lines are pulled out of it
          # afterwards. Filtering inside the pipeline hid a real failure once: `|| true` resets
          # PIPESTATUS, so xcodebuild's exit code was thrown away and a red build reported green.
          status=0
          xcodebuild test \
            -project Athkar.xcodeproj \
            -scheme Athkar \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log || status=$?

          echo "----- errors, failures and test counts -----"
          grep -E "error:|failed|Executed [0-9]+ test|\*\* (TEST|BUILD)" build.log | tail -40 || true
          exit "$status"

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build.log
          if-no-files-found: ignore
