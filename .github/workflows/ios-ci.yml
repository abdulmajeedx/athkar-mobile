name: iOS build & test

# The macOS runner is the only Swift compiler this project has access to, so every push that touches
# ios/ is compiled and tested here. Nothing below needs an Apple Developer account: simulator builds
# are unsigned.
on:
  push:
    # Branches only: a tag push matches every path filter, so publishing a release used to fire a
    # full iOS build for a commit already tested on the branch it came from.
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      # Simulator names drift between runner images, so the destination is discovered rather than
      # hardcoded — a missing "iPhone 16" should not read as a broken build.
      - name: Pick a simulator
        id: simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          best = None
          for runtime, devices in runtimes.items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable') and 'iPhone' in device['name']:
                      best = device['udid']
          print(best or '')
          ")
          if [ -z "$UDID" ]; then
            echo '::error::No available iPhone simulator on this runner'
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Two assets the compiler cannot check and a device fails silently on: iOS substitutes its
      # own tone for a notification sound longer than thirty seconds or in a format it does not
      # decode, and App Store Connect rejects an upload with no 1024px icon. Both are the kind of
      # fault that only shows up at the adhan, or at the upload.
      - name: Check the bundled assets
        working-directory: ios
        run: |
          set -euo pipefail
          SOUND=Athkar/Resources/adhan.caf
          [ -f "$SOUND" ] || { echo "::error::$SOUND is missing"; exit 1; }
          afinfo "$SOUND"
          DURATION=$(afinfo "$SOUND" | awk -F': ' '/estimated duration/ {print $2 + 0}')
          awk -v d="$DURATION" 'BEGIN {
            if (d <= 0) { print "::error::Could not read the adhan\047s duration"; exit 1 }
            # Strictly under, not "rounds to". The first cut of this file came out at 30.000181s
            # from packet granularity, which reads as thirty seconds in every human sense and is
            # over the line in the only sense that matters.
            if (d >= 30) {
              printf("::error::The adhan is %.6fs; iOS silently replaces any notification sound of 30s or more with its own tone\n", d)
              exit 1
            }
            printf("adhan: %.3fs, under the 30s limit\n", d)
          }'

          ICON=Athkar/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          [ -f "$ICON" ] || { echo "::error::$ICON is missing — App Store Connect rejects the upload"; exit 1; }
          sips -g pixelWidth -g pixelHeight "$ICON"

          # The corpus is one text in two bundles, and it drifted: the combined morning/evening
          # chapter was split in two on the Android side and the iOS copy kept the old file for
          # weeks, so the most-opened chapter in the app was a different chapter on each phone.
          # Nothing caught it, because both copies were internally valid.
          IOS_SEED=Athkar/Resources/athkar_seed.json
          ANDROID_SEED=../android/data/src/main/assets/athkar_seed.json
          if ! cmp -s "$IOS_SEED" "$ANDROID_SEED"; then
            echo "::error::The iOS and Android corpora differ — copy the Android asset over, since that is the one scripts/split_adhkar_times.py writes"
            shasum -a 256 "$IOS_SEED" "$ANDROID_SEED"
            exit 1
          fi
          echo "corpus: identical on both platforms"

      - name: Build and test
        working-directory: ios
        run: |
          set -o pipefail
          # The full transcript goes to the log and the interesting lines are pulled out of it
          # afterwards. Filtering inside the pipeline hid a real failure once: `|| true` resets
          # PIPESTATUS, so xcodebuild's exit code was thrown away and a red build reported green.
          status=0
          xcodebuild test \
            -project Athkar.xcodeproj \
            -scheme Athkar \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log || status=$?

          echo "----- errors, failures and test counts -----"
          grep -E "error:|failed|Executed [0-9]+ test|\*\* (TEST|BUILD)" build.log | tail -40 || true
          exit "$status"

      # The tests run *in* a simulator without ever starting the app, which leaves the one failure
      # that matters most unchecked. Android has had this gate since a release shipped a
      # crash-on-open: a build nobody has launched is a build nobody knows opens.
      - name: Launch the app on a simulator
        working-directory: ios
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          APP=$(find DerivedData/Build/Products -maxdepth 2 -name 'Athkar.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No Athkar.app was built"
            exit 1
          fi

          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          # simctl prints "<bundle id>: <pid>"; simulator processes are host processes, so the pid
          # can be watched from here.
          PID=$(xcrun simctl launch "$UDID" com.athkar.app | awk -F': ' '{print $2}')
          echo "launched as pid $PID"
          sleep 10

          if ! ps -p "$PID" > /dev/null; then
            echo "::error::The app exited within ten seconds of launching"
            ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -5 || true
            cat "$(ls -t ~/Library/Logs/DiagnosticReports/Athkar* 2>/dev/null | head -1)" 2>/dev/null || true
            exit 1
          fi
          echo "still running after ten seconds"

          # The first look anyone has had at these screens: nobody has run this app on a device.
          mkdir -p screenshots
          xcrun simctl io "$UDID" screenshot screenshots/launch.png
          xcrun simctl terminate "$UDID" com.athkar.app || true

      # The same archive command the TestFlight workflow runs, minus the signature — which is the
      # only part of it that needs a paid account. A Release build for a device can fail where a
      # Debug build for a simulator passes: different architecture, different optimiser, and the
      # synthesised Info.plist is only assembled here. Finding that out on the day the membership
      # is bought would be finding it out at the worst possible moment.
      - name: Archive for release, unsigned
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Athkar.xcodeproj \
            -scheme Athkar \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Athkar.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tail -20

          PLIST="$RUNNER_TEMP/Athkar.xcarchive/Products/Applications/Athkar.app/Info.plist"
          echo "----- the Info.plist that would be uploaded -----"
          for key in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion \
                     ITSAppUsesNonExemptEncryption NSLocationWhenInUseUsageDescription \
                     NSMotionUsageDescription; do
            value=$(/usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" 2>/dev/null || echo "MISSING")
            printf '%-38s %s\n' "$key" "$value"
            if [ "$value" = "MISSING" ]; then
              echo "::error::$key is missing from the built Info.plist"
              exit 1
            fi
          done

      - name: Upload the launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshot
          path: ios/screenshots
          if-no-files-found: ignore

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build.log
          if-no-files-found: ignore
