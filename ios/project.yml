# XcodeGen manifest. The .xcodeproj is generated rather than committed: a pbxproj is a merge-hostile
# binary-in-disguise, and this file says the same thing in twenty readable lines.
#
#   brew install xcodegen && cd ios && xcodegen generate && open Athkar.xcodeproj
name: Athkar
options:
  bundleIdPrefix: com.athkar
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: ar

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Kept level with the Android app's, because the two now carry the same features and a user
    # comparing the two store pages should not be told they are different products. The release
    # workflow overrides both from the tag it was pushed with.
    MARKETING_VERSION: "1.6.0"
    CURRENT_PROJECT_VERSION: "10600"
    # Set to your own Apple Developer team, or pick one in Xcode's Signing & Capabilities tab.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Athkar:
    type: application
    platform: iOS
    sources:
      - path: Athkar
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.athkar.app
        # The INFOPLIST_KEY_* settings below only become an Info.plist when Xcode is told to
        # synthesise one; without this the build looks for a file nobody wrote.
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: أذكاري
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: >-
          يُستخدم موقعك لحساب مواقيت الصلاة واتجاه القبلة. لا يغادر الجهاز.
        # The compass needs to know how far the phone is from flat, which CLHeading does not say.
        # Device motion prompts for nothing, but the key is what App Review looks for when a binary
        # links CoreMotion at all.
        INFOPLIST_KEY_NSMotionUsageDescription: >-
          تُستخدم حسّاسات الحركة لمعرفة ميل الجهاز، فالبوصلة لا تكون دقيقة إلا وهو مستوٍ.
        # Without this, every upload lands in TestFlight as "Missing Compliance" and cannot reach a
        # single tester until somebody answers the export-compliance question by hand in the web
        # console. The answer is NO and it never changes: the app has no encryption in it at all —
        # it makes no network requests of any kind.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        ENABLE_USER_SCRIPT_SANDBOXING: true

  AthkarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AthkarTests
    dependencies:
      - target: Athkar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.athkar.app.tests

schemes:
  Athkar:
    build:
      targets:
        Athkar: all
    test:
      targets:
        - AthkarTests
    run:
      config: Debug
